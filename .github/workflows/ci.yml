name: Automated Regression Suite (BK-14)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  regression-tests:
    name: BK-14 Regression Test Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run BK-14 Automated Regression Suite
        id: run_tests
        run: npm run test:ci
        continue-on-error: true

      - name: Defect Traceability Report & Gate Check
        run: npm run test:report

      - name: Verify Production Bundle Build
        run: npm run build
